# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# -- anchored: deferred delivery of tool schemas -----------------------------
#
# Taken from xiaobright/dsh-anchored-standard (MIT), three modules out of seven.
# Left out: custom-bash (solves a Windows/PTY problem that does not exist in
# WSL), instruction-hint (suppresses the AGENTS.md injection, which this stand
# wants), context-gate (marginal) and skill-search.
#
# This row must come FIRST: after-next waterfall transforms apply in reverse
# registration order, so the catalog filter has to register before anything else
# that touches the same assembly.
#
# bootstrapTools is the resident set, measured from session logs.
# Across 3440 tool calls in every preset the model only called bash, read, edit,
# write, grep, glob, todo_write and ask_user_question. Everything else -
# subagent, workflow, ralph, skill, exit_plan_mode, *_goal, send_message,
# interrupt_agent, list_agents, job_kill, cordis_* - was called zero times. So
# the set matches measured demand rather than the full catalog.
#
# ask_user_question is not a convenience but a capability: without it the agent
# cannot ask a question at all.
#
# The cost: schemas grew from 2056 to 2957 tokens per request. The full standard
# catalog is 6512, of which 4037 belong to tools never called once.
#
# dev_tool_search is kept but no longer relied on: across 9 sessions and 456
# calls it was never invoked, and the catalog in every request stayed as it was.
# Unlocking "in one call" is theoretical - anything not listed here does not
# exist for the model.
#
# compactionTools: after `compaction/end` the catalog falls back to
# bootstrapTools plus this, for exactly one request. dev_tool_search is kept here
# deliberately (the original does not have it): otherwise, after every
# compaction, the model has no way to bring back what it unlocked until its next
# message.
- id: tool-bootstrap
  name: ./tool-bootstrap.mjs
  config:
    # web_fetch is here because without it the agent cannot read a single link -
    # "anything not listed here does not exist for the model" (see above) - and
    # dev_tool_search is not called in practice. Its schema is tiny (one url
    # parameter). web_search is added only when a search key is present: the
    # bundled provider is deepseek-official with apiKeyEnv DEEPSEEK_API_KEY
    # (packages/bundle/base/cordis.patch.yml:461), and without a key the tool
    # would only spend a step on an error.
    bootstrapTools: !!js "['read', 'write', 'edit', 'bash', 'grep', 'glob', 'todo_write', 'ask_user_question', 'dev_tool_search', 'web_fetch'].concat((process.env.DEEPSEEK_API_KEY || process.env.EXA_API_KEY || process.env.PERPLEXITY_API_KEY) ? ['web_search'] : [])"
    promoteOn: either
    includeSubagents: false
    compactionTools: [dev_tool_search]

- id: dev-tool-search
  name: ./dev-tool-search.mjs

# -- advisory: what a file costs in tokens -----------------------------------
#
# A "keep files small" rule in ~/.dsh/AGENTS.md fails for three reasons: it is
# read once at the start and does not resurface at step 90; it is written about
# CREATING files and says nothing about an existing 1039-line one; and it states
# a line count, which the model cannot weigh against its budget. This plugin
# covers all three: it fires at the moment of the write, looks at the current
# size regardless of who created it, and reports tokens and the share of a
# working cycle.
#
# IT NEVER BLOCKS. tools/post-execute runs AFTER the write, so a blocking
# decision here does not prevent the file - it rejects the result of a write that
# already happened, and the model starts rewriting what is already on disk. The
# plugin always delegates to next() and only attaches a note.
#
# 450/800 is not "a decent file length" but the point where reading it whole
# stops being affordable: 450 lines of JS are about 5990 tokens (33% of an 18368
# cycle), 800 about 10649 (58%), and a 1039-line file about 18423 - the entire
# cycle, which is the pathology this plugin was written for.
#
# The note is issued ONCE per level transition per file per session: repeating it
# on every write would cost more context than the file itself.
#
# bytesPerToken and cycleTokens are a calibration; if thresholdRatio, retainRatio,
# the summary ceiling, the resident catalog or the size of AGENTS.md change,
# re-measure and correct cycleTokens.
# -- VRAM: launching training on an occupied card ----------------------------
# The model cannot see GPU load, and the model server holds almost the whole card
# (30-tune leaves 150-500 MiB free). Without this notice a "train a network"
# request turns into `python train.py`, minutes of data loading and an OOM
# traceback. The plugin measures free memory at launch time and answers the first
# such call with a refusal carrying the numbers and three ways out; after that it
# stays out of the way.
- id: gpu-budget-notice
  name: ./gpu-budget-notice.mjs
  config:
    minFreeMb: 2048

- id: file-size-notice
  name: ./file-size-notice.mjs
  config:
    warnLines: 450
    urgentLines: 800
    tools: [write, edit]
    bytesPerToken: 3.08
    cycleTokens: 18141
    # Global exclusions: files to say nothing about at all (data, generated
    # output). Patterns with `*`, matched against the tool's path.
    exclude: []
    # The "this file is one unit" marker belongs to the PROJECT and lives in it.
    #
    # "Split it" is wrong advice for code that is long but not separable - a
    # training loop, a generated file, a single algorithm. Three files of 300
    # lines cost exactly as much to read as one of 900 when you need all of it;
    # the real mitigation there is reading by ranges.
    #
    # A project lists such files in `.dsh-size-exempt` at its root (searched
    # upward): one pattern per line, `#` for comments, matched against the full
    # path and the bare file name. A marked file gets no "split it" advice and
    # stays silent at warn level; at urgent level it gets one note with the cost
    # and the advice to open it with grep -n and ranges.
    exemptFileName: .dsh-size-exempt
    exemptMaxDepth: 12

# -- advisory: what reading costs --------------------------------------------
#
# Splitting a 1000-line index.html into nine modules changed nothing: the agent
# read them all anyway. Measured over one session: 9 steps, 7 reads, ALL whole,
# one grep in the entire run; 17762 tokens = 97% of a cycle against 18423 for the
# single file before. The whole split saved 661 tokens, 3.6%.
#
# Splitting gave the ABILITY to read narrowly but created no BEHAVIOUR: the
# "read narrowly" and "do not re-read" rules in AGENTS.md were in force
# throughout that run. So the same decision as with file size: state the cost in
# the currency the agent spends, at the moment it spends it.
#
# Two notes: the accumulated read budget per cycle (thresholds 45% and 75%, once
# per level) and re-reading the same file whole. The counter resets on
# compaction/end - after a compaction the budget starts again.
#
# Verified by replaying that run: the warning fires on the fourth read at 67%,
# with three more reads worth 4847 tokens still ahead.
#
# bytesPerToken and cycleTokens are shared with file-size-notice; re-measure
# them together.
- id: read-budget-notice
  name: ./read-budget-notice.mjs
  config:
    warnPercent: 45
    urgentPercent: 75
    tools: [read]
    bytesPerToken: 3.08
    cycleTokens: 18141

# -- advisory: does this project need a DECISIONS.md --------------------------
#
# A map in DECISIONS.md is the cheapest thing in this configuration: nine lines
# for about 150 tokens instead of 17762 spent on exploratory reading. But a new
# project starts without one and nobody creates it.
#
# A rule does not solve this: it is read at step one, when the project is a
# single empty file and a journal is meaningless, and by step thirty, when it
# would pay off, the rule is far up the context. The same disease as the rules
# about file size and narrow reading.
#
# The plugin does NOT create the file and does not decide for the agent. It asks
# once per session, when the work has stopped being a one-off, and says plainly:
# if the task is throwaway, ignore it - a journal for discarded work is litter.
#
# Threshold: 3 different files touched in the project during the session (one
# file is a script, two a script and a test, three a structure someone will have
# to navigate). After a compaction the threshold drops to 2: a compaction means
# the session has already outgrown one window and the next one starts blind.
#
# Silent forever once the file exists - including when the agent just created it.
- id: decisions-file-notice
  name: ./decisions-file-notice.mjs
  config:
    fileName: DECISIONS.md
    minFiles: 3
    minFilesAfterCompaction: 2
    tools: [write, edit]

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    # The base bundle default is 65536 bytes - up to ~21000 tokens at the
    # measured 3.08 bytes per token, a third of the window, paid on EVERY request.
    #
    # This is the bundle's CEILING, not a fixed price: you pay for what is
    # actually on disk, so raising it costs nothing when there are no project
    # files.
    #
    # When the budget is short, the widest file is evicted first - which is the
    # global ~/.dsh/AGENTS.md, the carrier of all the working rules. So the
    # headroom is kept above its size rather than just at it.
    #
    # 12288 leaves about 5000 bytes for a project-level AGENTS.md. A fully used
    # bundle costs about 2660 tokens per request. (It went 4096 -> 6144 -> 8192 ->
    # 12288: at 8192 a grown global AGENTS.md plus a project one exceeded the
    # budget and the global file was silently dropped whole, with "omitted
    # ~/.dsh/AGENTS.md" in every request.)
    maxBytes: 12288

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  # Cap on a single `read`. The package default of 50 KiB (read-render.ts:14) is
  # about 14k tokens - one call eats a whole cycle between compactions; one
  # measured call read 34410 characters at once. 16 KiB is about 4.5k tokens, and
  # the tool itself prints "Output capped ... Use offset=N to continue", so
  # pagination remains and only "everything at once" becomes expensive.
  config:
    readMaxBytes: 16384

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

# The skills catalog is off in the working preset: the only skills left are the
# eight univer ones, about 800 tokens in every prefix and after every compaction,
# with zero calls across 144 sessions. The univer_* tools stay reachable through
# dev_tool_search. For documents (.xlsx/.docx/.pptx/.univer) use the
# "Local 64k + Office" preset, which scripts/make-office-preset.sh generates from
# this file with the row enabled. Check: a new session has no user-role
# skill-catalog message.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # The stock class is replaced by a subclass (see the header of
    # compaction-notools.mjs): summaries without the tool catalog (23 of 36
    # compactions in one session returned a tool call instead of text) and a
    # threshold based on server usage rather than the meter's estimate, which
    # overstates the context roughly twofold with this chat template.
    - id: compaction-basic
      name: ./compaction-notools.mjs
      config:
        # The threshold is floor(contextWindow x ratio), a share of the window
        # rather than an absolute, so moving from 32k to 64k doubled both the
        # threshold and the headroom.
        #
        # Why 0.7 and not more: the check on agent/pre-step sees the PREVIOUS
        # measurement, so the real peak is threshold + the growth of one step.
        # Measured across four sessions the worst single-step growth was 17910
        # tokens. At 0.75 that gives 49152 + 17910 = 67062 against a 65536 wall;
        # the package default of 0.8 gives 70338. At 0.7 the threshold is 45875
        # with 19661 of headroom - more than the worst step - and the measured
        # peaks of those runs (59818 / 54708 / 53646 / 49970) all sit above it,
        # so compaction fires a step earlier rather than less often.
        thresholdRatio: 0.70

        # The package default 0.16 is 10485 tokens of the window (retainRatio
        # counts from the WINDOW, not from the threshold). Measured: a compaction
        # dropped the context from 44308 to 19043, losing 25k, after which the
        # model spent 5-6 steps rebuilding it.
        #
        # 0.25 was chosen when a summary cost 3072 tokens. After raising maxTokens
        # to 6144 the tail and the summary together ate the cycle between
        # compactions: prefix 8050 + tail 16384 + summary 6144 = 30578 against a
        # 45875 threshold, leaving 15297 for work - LESS than the worst measured
        # single-step growth (17910), so one heavy step right after a compaction
        # crosses the threshold again.
        #
        # 0.20 = 13107: 8050 + 13107 + 6144 = 27301, a cycle of 18574 > 17910.
        # The price is a tail shorter by 3277 tokens, about three steps of history.
        #
        # The 8050 prefix was measured at 3.08 bytes per token: system prompt 2420
        # + nine tool schemas 3861 + AGENTS.md 1773. A project AGENTS.md filling
        # the whole bundle would push the prefix to ~9050 and the cycle down to
        # ~17570, below the worst step again - so if you add one, re-measure and
        # trim the tail further (0.18 = 11796).
        retainRatio: 0.20

        # Cap on the summary itself. The package default is 8192.
        #
        # It used to be 3072, on the reasoning that a checkpoint should not eat
        # the budget a compaction had just freed. That was not enough: at 3072
        # MOST compactions were truncated - 12 of 19, 21 of 23, 25 of 27 - with
        # "summarization truncated at the token cap (incomplete checkpoint)". A
        # truncated checkpoint means the compaction did not happen: the threshold
        # stays crossed, compaction restarts on the next step, and the context
        # keeps growing meanwhile. That, rather than the threshold itself, is the
        # main cause of overflows.
        #
        # Moving to the nothink route (below) did not fix it: the problem is not
        # the budget going into thinking but the compactor's eight instruction
        # sections not fitting into 3072 tokens.
        #
        # At 6144 the post-compaction state is about 3500 prefix + 16384 tail +
        # up to 6144 summary = ~26000, leaving ~20000 of working headroom under
        # the 45875 threshold. If truncation returns, raise it to the 8192
        # default.
        maxTokens: 6144

        # The summary goes to the same model through an entry with thinking off
        # (profiles/web/cordis.patch.yml, id qwen38-27b-nothink).
        #
        # Why: on one day 46 of 50 compactions ended with "summarization truncated
        # at the token cap (incomplete checkpoint)". Reasoning and the summary
        # share one output budget - the budget went into thinking, the checkpoint
        # was never finished, the threshold stayed crossed and compaction started
        # again on the very next step, about 95 s per attempt. A summary is
        # auxiliary work that needs no thinking.
        #
        # If checkpoints still get truncated, raise maxTokens here (the package
        # default is 8192).
        summarizationProvider: qwen-local
        summarizationModel: qwen38-27b-nothink

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        # Worker mode. Measured: two of 13 workers ran into max-tokens while
        # trying to emit a translation dictionary as text, and their truncated
        # answers (36066 and 33060 characters) went to the parent whole as
        # subagent-settled - about 20k tokens of litter in the parent's context.
        # maxTokens 4096 caps the price of such a failure at four thousand.
        # The route is inherited from the parent (modelSelectionSettings), so no
        # provider/model here. The persona carries the worker rules the parent
        # tends to forget to state in the prompt.
        agentOptions:
          maxTokens: 4096
        persona: >-
          You are a worker subagent with a fresh, small context. Your input is
          on disk; your output goes to disk. Read input in ranges, never a
          whole file over 16 KB. Write results with `write` to the path you were
          given, verify with a script whose output is a few lines, and finish
          with a closing message of at most 10 lines: what you wrote, where,
          counts, and anything unfinished. Never print data, tables, or code in
          your closing message or in send_message.

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
    # Limits for a 64k window. The package defaults assume large windows and are
    # fatal here: fetchMaxOutputChars of 200000 characters is about 57000 tokens,
    # nearly twice the whole window, so one web_fetch of a large page guarantees
    # CONTEXT_WINDOW_EXCEEDED. 12000 characters is about 3400 tokens, roughly a
    # quarter of the working budget.
    fetchMaxOutputChars: 12000
    # Eight sources with snippets are also several thousand tokens. Three are
    # enough, and the model reads the page it needs through web_fetch.
    searchMaxResults: 3
    # With the native DeepSeek provider every query is a full model turn in both
    # latency and tokens: it has no separate search endpoint.
    searchMaxQueries: 2
