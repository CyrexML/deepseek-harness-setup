name: Local 64k
description: The stand working preset. Compaction threshold 0.7 on a 65536 window, 0.20 tail, summary up to 6144 tokens. A resident catalog of nine tools (read/write/edit/bash/grep/glob/todo_write/ask_user_question/dev_tool_search); everything else on demand through dev_tool_search. One request falls back to the small catalog after a compaction.
order: 1
