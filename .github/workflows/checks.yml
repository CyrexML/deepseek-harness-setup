# Checks that catch what breaks an install on someone else's machine: script
# syntax on both platforms, .ps1 encoding and traces of personal data.
name: checks

on:
  push:
  pull_request:

jobs:
  linux:
    name: WSL scripts and modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - name: no CRLF in WSL scripts
        run: |
          fail=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then echo "CRLF in $f - bash will not run that file"; fail=1; fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: preset and patch modules parse
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" 2>/dev/null || node -e "import('file://$PWD/${f#./}').catch(e => { console.error('$f: ' + e.message); process.exit(1) })" || fail=1
          done < <(find . -name '*.mjs' -not -path './.git/*')
          exit $fail

      - name: JSON and YAML parse
        run: |
          python3 - <<'PY'
          import json, sys, pathlib, yaml
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts: continue
              try: json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: bad.append(f'{p}: {e}')
          class L(yaml.SafeLoader): pass
          L.add_multi_constructor('!', lambda *a: None)
          L.add_multi_constructor('tag:yaml.org,2002:js', lambda *a: None)
          for p in list(pathlib.Path('.').rglob('*.yml')) + list(pathlib.Path('.').rglob('*.yaml')):
              if '.git' in p.parts: continue
              try: list(yaml.load_all(p.read_text(encoding='utf-8'), Loader=L))
              except Exception as e: bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'every file parses')
          sys.exit(1 if bad else 0)
          PY

      - name: no traces of personal data
        run: |
          # A home path is caught by the user name, but generic examples
          # (/home/user, /home/me) are documentation, not a leak.
          hits=$(grep -rInE 'BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|/home/[a-z][a-z0-9_-]+/' \
                   --exclude-dir=.git --exclude=checks.yml . \
                 | grep -vE '/home/(user|me|username|youruser|ubuntu|runner)/' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo 'keys or home paths found'; exit 1
          fi
          echo 'clean'

  windows:
    name: Windows scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { Write-Host "SYNTAX: $($_.FullName): $($errors[0].Message)"; $bad = 1 }
          }
          exit $bad

      - name: .ps1 files with non-ASCII text carry a BOM
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 reads a file without a BOM as ANSI, so
          # non-ASCII text turns into garbage and breaks parsing. A pure ASCII
          # file needs no BOM, and demanding one from every file would flag
          # something that breaks nothing.
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $nonAscii = $false
            foreach ($b in $bytes) { if ($b -gt 0x7F) { $nonAscii = $true; break } }
            if ($nonAscii -and -not $hasBom) {
              Write-Host "non-ASCII without BOM: $($_.FullName)"; $bad = 1
            }
          }
          exit $bad
